[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisnemo"
version = "0.1.0"
description = "Whisper + NeMo MSDD pipeline for transcription and speaker diarization"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Dhairya Umrania" }
]
requires-python = "==3.10.*"
keywords = ["whisper", "nemo", "diarization", "transcription", "asr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  "numpy==1.23.5",
  "pandas>=1.5,<3.0",
  "nltk==3.9.1",
  "wget==3.2",
]

[project.optional-dependencies]
diarize = [
  "openai-whisper",
  "deepmultilingualpunctuation==1.0.1",
  "demucs==4.0.1",
  "nemo-toolkit[asr]==2.7.2",
]

embed = [
  "transformers",
  "soundfile",
  "librosa",
  "pandas>=1.5,<3.0",
]

dev = [
  "build>=1.2.2",
  "twine>=6.1.0",
  "pytest>=8.0",
  "cibuildwheel>=2.20",
]

[project.urls]
Homepage = "https://github.com/humanlab/WhisNemo"
Repository = "https://github.com/humanlab/WhisNemo"
Issues = "https://github.com/humanlab/WhisNemo/issues"

[project.scripts]
whisnemo = "whisnemo.cli.main:main"
whisnemo-diarize = "whisnemo.cli.diarize_cli:main"
whisnemo-batch = "whisnemo.cli.batch_cli:main"
whisnemo-extract = "whisnemo.cli.extract_cli:main"
whisnemo-stutter = "whisnemo.cli.stutter_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisnemo = ["configs/*.yaml", "scripts/*.sh"]
